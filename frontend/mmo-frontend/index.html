<!DOCTYPE html>
<html lang="pt-PT">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MMORPG Web - Phaser + TS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>

<body>
  <div id="game-container" class="hidden">
    <div id="phaser-game" class="game-view glass"></div>
  </div>

  <div id="mobile-controls">
    <div id="mobile-dpad">
      <button id="btn-up" class="dpad-btn touch-btn">▲</button>
      <button id="btn-left" class="dpad-btn touch-btn">◀</button>
      <button id="btn-right" class="dpad-btn touch-btn">▶</button>
      <button id="btn-down" class="dpad-btn touch-btn">▼</button>
    </div>
    <div id="mobile-actions">
      <button id="btn-attack" class="action-btn touch-btn">⚔️</button>
    </div>
  </div>

  <div id="game-version">v0.1.6</div>
  <div id="vue-ui"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
