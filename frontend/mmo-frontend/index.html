<!DOCTYPE html>
<html lang="pt-PT">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MMORPG Web - Phaser + TS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>

<body>
  <div id="login-overlay" class="overlay">
    <div class="login-card glass">
      <h1>MMORPG Web</h1>
      <p>Entra no mundo e começa a tua aventura</p>

      <div id="connection-error" class="error-banner hidden">
        Não foi possível conectar ao servidor.
      </div>

      <input type="text" id="username" placeholder="Nome da personagem..." maxlength="12">
      <button id="btn-join" class="btn-primary">ENTRAR NO JOGO</button>

      <div id="server-status" class="status-container hidden">
        <div class="spinner"></div>
        <span id="status-text">Conectando ao servidor...</span>
      </div>
    </div>
  </div>

  <div id="game-container" class="hidden">
    <div class="game-layout">
      <!-- Main Game Area -->
      <div class="game-main">
        <!-- Phaser Game Canvas -->
        <div id="phaser-game" class="game-view glass"></div>

        <!-- Game Log Footer -->
        <div id="game-log-footer" class="glass"></div>
      </div>

      <!-- UI Sidebar -->
      <div class="sidebar glass">
        <div id="character-panel"></div>
        <div class="coordinates">
          Posição: <span id="pos-x">0</span>, <span id="pos-y">0</span>
        </div>
      </div>
    </div>
  </div>

  <div id="mobile-controls">
    <div id="mobile-dpad">
      <button id="btn-up" class="dpad-btn touch-btn">▲</button>
      <button id="btn-left" class="dpad-btn touch-btn">◀</button>
      <button id="btn-right" class="dpad-btn touch-btn">▶</button>
      <button id="btn-down" class="dpad-btn touch-btn">▼</button>
    </div>
    <div id="mobile-actions">
      <button id="btn-attack" class="action-btn touch-btn">⚔️</button>
    </div>
  </div>

  <div id="attributes-modal-overlay"></div>

  <div id="game-version">v0.1.6</div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
